name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360   # máximo permitido por GitHub

    steps:
      - name: Validar secrets
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TS_KEY) { Write-Error "Falta el secret TAILSCALE_AUTH_KEY"; exit 1 }
          if (-not $env:RDP_PASSWORD -or $env:RDP_PASSWORD.Length -lt 14) {
            Write-Error "Falta el secret RDP_PASSWORD o tiene menos de 14 caracteres"; exit 1
          }

      - name: Configurar RDP (NLA activado, solo accesible por Tailscale)
        shell: pwsh
        run: |
          $ts = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $ts -Name fDenyTSConnections -Value 0 -Force
          # NLA activado: exige autenticación antes de abrir la sesión
          Set-ItemProperty -Path "$ts\WinStations\RDP-Tcp" -Name UserAuthentication -Value 1 -Force

          Get-NetFirewallRule -Name 'RDP-Tailscale' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          # Solo acepta conexiones desde el rango de Tailscale (100.64.0.0/10)
          New-NetFirewallRule -Name 'RDP-Tailscale' -DisplayName 'RDP-Tailscale' `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 | Out-Null

          Restart-Service -Name TermService -Force

      - name: Crear usuario RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name 'RDP' -Password $secure -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group 'Administrators' -Member 'RDP'
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP'
          if (-not (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue)) {
            Write-Error 'No se pudo crear el usuario'; exit 1
          }

      - name: Conectar Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-runner-${{ github.run_id }}

      - name: Obtener IP de Tailscale
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) { $ts = 'tailscale' }
          $ip = $null
          for ($i = 0; $i -lt 12 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep -Seconds 5 }
          }
          if (-not $ip) { Write-Error 'Tailscale no asignó IP'; exit 1 }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verificar RDP
        shell: pwsh
        run: |
          $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $r.TcpTestSucceeded) { Write-Error 'El puerto 3389 no responde'; exit 1 }
          Write-Host 'RDP OK'

      - name: Mantener activo
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=== ACCESO RDP ==="
          Write-Host "Dirección : $env:TAILSCALE_IP"
          Write-Host "Usuario   : RDP"
          Write-Host "Contraseña: la del secret RDP_PASSWORD"
          Write-Host "=================="
          Write-Host ""

          # Termina solo a los 340 min, antes del límite de 360
          $end = (Get-Date).AddMinutes(340)
          while ((Get-Date) -lt $end) {
            $left = [int]($end - (Get-Date)).TotalMinutes
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP activo - quedan ~$left min (cancelá el workflow para cerrar)"
            Start-Sleep -Seconds 300
          }
